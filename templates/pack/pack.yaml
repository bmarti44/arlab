# See docs/PACK-AUTHORING.md. Fields not listed here do not exist.
name: __NAME__
image: {base: "nvcr.io/nvidia/pytorch:25.10-py3"}
prepare: {command: "python /frozen/prepare.py --out /data", timeout_s: 3600}
run:
  command: "python /frozen/harness.py --out /out --seed {seed} --split {split}"
  timeout_s: 600
  gpu: false
  mem_gb: 4
evaluate: {command: "python /eval/evaluate.py --run /run_out --out /result/metrics.json", timeout_s: 300}
budget: {unit: steps, limit: 1000}          # the frozen harness writes /out/budget.json {"steps": N}
metric: {name: accuracy, direction: maximize, mes: 0.05}   # fix MES before calibration; rates are fractions
guards:
  - {name: train_s, max_ratio_vs_baseline: 1.3}
seeds: {calibration: [1, 2, 3, 4, 5], screen: 1, confirm: [2, 3], holdout: [101, 102, 103]}
services: []
references: []
verdict: {compare_to: baseline}
agent: {model: gpt-6.1-sol, effort: high, visible: [program.md, IDEA.md], timeout_s: 900}
campaign: {max_experiments: 200, max_hours: 24, max_agent_calls: 400, stop_after_no_keep: 40, rescue_after: 8}
acceptance: {allow_underpowered: false}
