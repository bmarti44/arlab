[project]
name = "arlab"
version = "0.1.0"
description = "A small, honest autoresearch lab for one DGX Spark"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.scripts]
arlab = "arlab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs the GPU / docker on the Spark", "docker: needs docker (CPU fixture campaigns)"]
