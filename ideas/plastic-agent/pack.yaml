name: plastic-agent
image: {base: "nvcr.io/nvidia/pytorch:25.10-py3"}
# PREPARE runs from frozen/prepare/ (mounted only into PREPARE): the FauxOS generator, the world seeds and the explorer
# are never visible to RUN. CPU only, ~10 s.
prepare: {command: "python /prepare/prepare.py --out /data", timeout_s: 900}
run:
  # Per-world budget of adapt(), owned by the trusted supervisor (the surface runs in a fresh Landlock-sandboxed child
  # per world and reaches the model only by RPC): wall clock (CLOCK_MONOTONIC, from "go", so the surface import counts)
  # + gen tokens + train tokens; the child's process group is killed at adapt-seconds + 15 s grace. CALIBRATE IN THE GPU
  # PILOT; keep budget.limit = adapt-seconds + 30. A CANDIDATE adapts twice per world: to the world and to its twin (the
  # world-specific control: same tool names / vocabulary, other semantics), each pass with the full per-world budget.
  command: "python /frozen/harness.py --out /out --seed {seed} --split {split} --adapt-seconds 160 --gen-tokens 400000 --train-tokens 1500000"
  # v2 worst case (every pass uses its full 160 s + 15 s grace): holdout 64 passes (32 worlds + twins) x 175 s + 33
  # base-weight hashes x ~20 s + load ~45 s = ~11900 s; validation 8 x 175 + 5 x 20 + 45 = ~1550 s.
  # v2 pilot (baseline, 5 seeds): validation RUN 130-185 s (adapt ~8.5 s per pass), EVALUATE ~190 s.
  timeout_s: 14400
  gpu: true
  mem_gb: auto
# EVALUATE (GB10, gate 2: none 155 s incl. the base-cache fill, icl 70 s). A candidate: model load + own-world pass +
# the twin control pass (one more merge + pass, ~15-40 s validation / ~35-100 s holdout) + its battery share:
# est. ~3 min validation, ~5-6 min holdout (+~2 min for the first run's base-cache fill). 3000 s is ample. CALIBRATE.
evaluate: {command: "python /eval/evaluate.py --run /run_out --out /result/metrics.json", timeout_s: 4500}
budget: {unit: adapt_s_max, limit: 190}  # longest single-world adapt() wall time (s); a run over it is invalid
# v2 (V2-DESIGN-sol.md): MES 0.06 unchanged. Holdout = 32 fam worlds x 60 tasks = 1920 items, 3 holdout seeds.
#   v2 pilot: baseline seed sigma 0.0019; icl-vs-baseline item sd 0.53 -> iid SE 0.012. World-bootstrap SE of the
#   icl-vs-baseline difference (worst-case proxy, 4 validation worlds: 0.065) scaled to 16 worlds = 0.033 > 0.024, so the
#   holdout was raised from 16 to 32 worlds: 0.065 * sqrt(4/32) = 0.023 <= 0.024 (sol's rule: add worlds, never change MES).
metric: {name: success, direction: maximize, mes: 0.06}
guards:
  # v2: the two forgetting batteries are guarded SEPARATELY (v1's pooled battery_drop hid a 3-6.5 pt GSM8K loss).
  # Thresholds = baseline mean drop + max(0.03, 2*SD of the 5 calibration-seed baseline drops), fixed from the v2 pilot
  # BEFORE the campaign (the bare max(0.03, 2SD) = 0.03 would fail the baseline itself: its mean drops are 0.030 / 0.038).
  # v2 pilot baseline seeds 1-5: gsm8k_drop .015 .035 .035 .030 .035 (mean .030, sd .009);
  #                              guardworld_drop .030 .030 .030 .060 .040 (mean .038, sd .013)
  - {name: gsm8k_drop, max: 0.06}         # 0.030 + 0.03
  - {name: guardworld_drop, max: 0.07}    # 0.038 + 0.03, rounded up
  - {name: prefill_tokens, max: 1000}     # no transcript in the prompt: prompt positions per task incl. the retry call
                                          # (surface arms ~140 first call, <= ~400 with a retry; the ICL arm ~3.2k)
  # world-specific learning control: (success - twin_success) / (success - none_success), where twin_success = each
  # world scored with the adapter the surface made from its TWIN's transcript (same names and vocabulary, deranged
  # semantics); 1.0 when success - none < 0.025
  - {name: world_specific_share, min: 0.5}
  - {name: peak_mem_gb, max: 60}
seeds: {calibration: [1, 2, 3, 4, 5], screen: 1, confirm: [2, 3], holdout: [101, 102, 103]}
references:                               # frozen arms, run once on the screen seed in CALIBRATE
  - {name: none, path: frozen/run/ref_none}         # (a) no adaptation
  - {name: icl, path: frozen/run/ref_icl}           # (b) the transcript in context
  - {name: placebo, path: frozen/run/ref_placebo}   # (e) the baseline LoRA of world i+1 scored on world i
verdict: {compare_to: baseline}
agent: {model: gpt-6.1-sol, effort: high, visible: [program.md, frozen/run/surface_api.py, frozen/run/child.py, frozen/run/engine.py, frozen/run/trainer.py, frozen/run/common.py], timeout_s: 900}
# Validation run: RUN ~9 min for a baseline-like surface (8 adapt passes of ~30-60 s + hashes + load; uncalibrated) up to
# ~28 min for a surface that uses every pass's full budget, + ~3 min EVALUATE; a screen is 1 run, a confirm 2 more.
campaign: {max_experiments: 40, max_hours: 16, max_agent_calls: 80, stop_after_no_keep: 15, rescue_after: 6}
acceptance: {allow_underpowered: false}
