name: nanochat-lite
image: {base: "nvcr.io/nvidia/pytorch:25.10-py3"}
prepare: {command: "python /frozen/prepare.py --out /data", timeout_s: 3600}
run:
  command: "python /frozen/harness.py --out /out --seed {seed} --split {split} --budget 62914560"
  timeout_s: 600
  gpu: true
  mem_gb: auto
evaluate: {command: "python /eval/evaluate.py --run /run_out --out /result/metrics.json", timeout_s: 300}
budget: {unit: tokens, limit: 62914560}
metric: {name: val_bpb, direction: minimize, mes: 0.01}
guards:
  - {name: train_s, max_ratio_vs_baseline: 1.05}   # compute-matched since T2b (was 1.3: T2 winners scaled the model into the slack)
  - {name: params_m, max: 60}
  - {name: peak_mem_gb, max: 60}
seeds: {calibration: [1, 2, 3, 4, 5], screen: 1, confirm: [2, 3], holdout: [101, 102, 103, 104, 105]}
agent: {model: gpt-6.1-sol, effort: high, visible: [program.md, IDEA.md], timeout_s: 900}
campaign: {max_experiments: 200, max_hours: 3, max_agent_calls: 400, stop_after_no_keep: 40, rescue_after: 8}
acceptance: {allow_underpowered: false}
