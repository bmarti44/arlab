name: digits-label-smoothing
image: {base: "nvcr.io/nvidia/pytorch:25.10-py3"}
prepare: {command: "python /frozen/prepare.py --out /data", timeout_s: 600}
run:
  command: "python /frozen/harness.py --out /out --seed {seed} --split {split}"
  timeout_s: 120
  gpu: false
  mem_gb: 2
evaluate: {command: "python /eval/evaluate.py --run /run_out --out /result/metrics.json", timeout_s: 60}
budget: {unit: steps, limit: 1500}
metric: {name: accuracy, direction: maximize, mes: 0.05}
guards:
  - {name: train_s, max_ratio_vs_baseline: 1.5}
seeds: {calibration: [1, 2, 3, 4, 5], screen: 1, confirm: [2, 3], holdout: [101, 102, 103]}
agent: {model: gpt-6.1-sol, effort: high, visible: [program.md, IDEA.md], timeout_s: 600}
campaign: {max_experiments: 20, max_hours: 0.5, max_agent_calls: 40, stop_after_no_keep: 12, rescue_after: 8}
acceptance: {allow_underpowered: false}
